<text x="244" y="105" fill="#3978D7" font-size="9" font-weight="800">DIAGNOSE</text><text x="244" y="142" fill="#101828" font-size="30" font-weight="800">这些问题值得在分析前看一眼。</text><text x="244" y="169" fill="#667085" font-size="11">发现问题和修改数据是两件事。每一条建议都说明原因、证据和系统准备做什么。</text>
<g transform="translate(244 194)"><rect width="355" height="35" rx="10" fill="#EEF2F6"/><rect x="4" y="4" width="80" height="27" rx="7" fill="#fff"/><text x="44" y="22" fill="#101828" font-size="9" text-anchor="middle">全部 13</text><text x="132" y="22" fill="#69788C" font-size="9" text-anchor="middle">必须处理 1</text><text x="222" y="22" fill="#69788C" font-size="9" text-anchor="middle">建议检查 6</text><text x="309" y="22" fill="#69788C" font-size="9" text-anchor="middle">优化建议 6</text></g>
<g transform="translate(244 248)"><rect width="916" height="215" rx="16" fill="#fff" stroke="#DFE5ED"/><rect width="4" height="215" rx="2" fill="#C43C46"/><rect x="20" y="18" width="31" height="31" rx="9" fill="#FFF0F1"/><text x="35" y="39" fill="#C43C46" font-size="18" text-anchor="middle">!</text><text x="63" y="28" fill="#667085" font-size="8" font-weight="700">必须处理</text><text x="63" y="50" fill="#101828" font-size="16" font-weight="750">发现完全重复记录</text><text x="820" y="35" fill="#98A2B3" font-size="9">影响 42 行</text><text x="20" y="78" fill="#53647A" font-size="10">共有 42 行与更早的记录完全一致，可能让 GMV、订单量、成本等指标被重复计算。</text><rect x="20" y="94" width="108" height="42" rx="9" fill="#F7F9FB"/><text x="31" y="110" fill="#7C899A" font-size="8">重复行</text><text x="31" y="126" fill="#35455A" font-size="11" font-weight="700">42</text><rect x="137" y="94" width="108" height="42" rx="9" fill="#F7F9FB"/><text x="148" y="110" fill="#7C899A" font-size="8">占数据量</text><text x="148" y="126" fill="#35455A" font-size="11" font-weight="700">1.3%</text><line x1="20" y1="151" x2="896" y2="151" stroke="#EDF1F5"/><text x="20" y="174" fill="#8A96A6" font-size="8" font-weight="700">为什么值得处理</text><text x="20" y="193" fill="#56667B" font-size="9">完全重复会直接影响聚合结果，是分析前优先级很高的问题。</text><text x="467" y="174" fill="#8A96A6" font-size="8" font-weight="700">DATAREADY 建议</text><text x="467" y="193" fill="#56667B" font-size="9">保留第一次出现的记录，删除后续完全相同的行。</text><rect x="730" y="170" width="151" height="29" rx="8" fill="#EDF4FF" stroke="#B9D0F1"/><text x="806" y="188" fill="#265EAA" font-size="9" font-weight="700" text-anchor="middle">✓ 已加入清洗方案</text></g>
<g transform="translate(244 480)"><rect width="916" height="245" rx="16" fill="#fff" stroke="#DFE5ED"/><rect width="4" height="245" rx="2" fill="#D18A2C"/><rect x="20" y="18" width="31" height="31" rx="9" fill="#FFF6E7"/><text x="35" y="39" fill="#A3620C" font-size="16" text-anchor="middle">△</text><text x="63" y="27" fill="#667085" font-size="8" font-weight="700">建议检查   city</text><text x="63" y="50" fill="#101828" font-size="16" font-weight="750">city 可能存在类别值不一致</text><text x="820" y="35" fill="#98A2B3" font-size="9">影响 126 行</text><text x="20" y="78" fill="#53647A" font-size="10">发现 4 组写法不同、但可能代表同一城市的值。语义类合并默认需要人工确认。</text><g transform="translate(20 95)"><rect width="125" height="48" rx="9" fill="#F7F9FB"/><text x="11" y="17" fill="#7C899A" font-size="8">上海市</text><text x="11" y="33" fill="#35455A" font-size="10" font-weight="700">17 行</text><text x="72" y="33" fill="#255FB4" font-size="8">→ 上海</text><rect x="134" width="125" height="48" rx="9" fill="#F7F9FB"/><text x="145" y="17" fill="#7C899A" font-size="8">Shanghai</text><text x="145" y="33" fill="#35455A" font-size="10" font-weight="700">10 行</text><text x="205" y="33" fill="#255FB4" font-size="8">→ 上海</text><rect x="268" width="125" height="48" rx="9" fill="#F7F9FB"/><text x="279" y="17" fill="#7C899A" font-size="8">上海␠</text><text x="279" y="33" fill="#35455A" font-size="10" font-weight="700">11 行</text><text x="339" y="33" fill="#255FB4" font-size="8">→ 上海</text></g><line x1="20" y1="158" x2="896" y2="158" stroke="#EDF1F5"/><text x="20" y="181" fill="#8A96A6" font-size="8">为什么值得处理</text><text x="20" y="199" fill="#56667B" font-size="9">同一地区被拆成多个类别，会影响城市维度的 GMV、订单量等结果。</text><text x="20" y="225" fill="#7394BE" font-size="8">✦ Semantic + Normalized Category Matcher   置信度 96%</text><rect x="744" y="198" width="136" height="29" rx="8" fill="#fff" stroke="#CBD5E1"/><text x="812" y="216" fill="#52657C" font-size="9" text-anchor="middle">加入清洗方案</text></g>
