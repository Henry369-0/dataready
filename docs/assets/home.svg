<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#F7F9FC"/><g font-family="Inter,Noto Sans CJK SC,Noto Sans,sans-serif">
<rect x="0" y="0" width="1200" height="66" fill="#F9FBFD"/><line x1="0" y1="66" x2="1200" y2="66" stroke="#DFE5ED"/>
<rect x="48" y="18" width="31" height="31" rx="10" fill="#0B1220"/><path d="M57 27h13M57 33h13M57 39h7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="m67 42 3 3 6-7" stroke="#9EE6C3" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="89" y="40" fill="#101828" font-size="17" font-weight="800">DataReady</text>
<rect x="1010" y="16" width="124" height="34" rx="9" fill="#fff" stroke="#CBD5E1"/><text x="1072" y="38" fill="#34445A" font-size="12" text-anchor="middle" font-weight="700">GitHub</text>
<rect x="50" y="119" width="166" height="28" rx="14" fill="#F1F6FD" stroke="#D7E2F1"/><circle cx="68" cy="133" r="4" fill="#4D8FEA"/><text x="81" y="138" fill="#45617F" font-size="10" font-weight="800" letter-spacing="1">ANALYSIS PREFLIGHT</text>
<text x="50" y="212" fill="#101828" font-size="53" font-weight="820">在分析之前，</text><text x="50" y="273" fill="#63748A" font-size="53" font-weight="820">先确认数据是否准备好。</text>
<text x="50" y="321" fill="#667085" font-size="16">自动检查 Excel / CSV 中的缺失、重复、类型、类别、异常和业务逻辑问题，</text><text x="50" y="348" fill="#667085" font-size="16">生成一份可审查、可撤销、可复现的清洗方案。</text>
<g fill="#5F6E82" font-size="12"><text x="50" y="399">● 浏览器本地处理</text><text x="205" y="399">● 不覆盖原始数据</text><text x="362" y="399">● 自动生成 Python</text></g>
<rect x="672" y="111" width="478" height="410" rx="23" fill="#fff" stroke="#D9E2EC"/><rect x="864" y="158" width="94" height="94" rx="26" fill="#EDF4FF"/><path d="M911 182v38M895 200l16-18 16 18" stroke="#3978D7" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="911" y="288" fill="#101828" font-size="24" font-weight="780" text-anchor="middle">把数据拖到这里</text><text x="911" y="320" fill="#667085" font-size="13" text-anchor="middle">支持 CSV / XLSX / XLS，数据默认只在浏览器中解析。</text><rect x="773" y="355" width="276" height="47" rx="12" fill="#0B1220"/><text x="911" y="384" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">选择数据文件</text><text x="911" y="436" fill="#667085" font-size="12" text-anchor="middle">没有文件？ <tspan fill="#255FB4" font-weight="700">体验示例经营数据 →</tspan></text>
<line x1="50" y1="572" x2="1150" y2="572" stroke="#DFE5ED"/><text x="50" y="610" fill="#667085" font-size="12">一个很小但完整的数据准备工作流</text><g fill="#52657C" font-size="12"><text x="675" y="610">✓ 先体检，再清洗</text><text x="840" y="610">✓ 高风险操作不自动执行</text><text x="1045" y="610">✓ 修改过程可追踪</text></g>
<g transform="translate(50 645)"><rect width="1060" height="42" rx="12" fill="#fff" stroke="#E2E8F0"/><text x="28" y="27" fill="#3978D7" font-size="11" font-weight="800">UPLOAD</text><text x="210" y="27" fill="#98A2B3" font-size="15">→</text><text x="270" y="27" fill="#3978D7" font-size="11" font-weight="800">DIAGNOSE</text><text x="456" y="27" fill="#98A2B3" font-size="15">→</text><text x="510" y="27" fill="#3978D7" font-size="11" font-weight="800">REVIEW</text><text x="676" y="27" fill="#98A2B3" font-size="15">→</text><text x="730" y="27" fill="#3978D7" font-size="11" font-weight="800">CLEAN</text><text x="875" y="27" fill="#98A2B3" font-size="15">→</text><text x="930" y="27" fill="#147D56" font-size="11" font-weight="800">READY</text></g>
</g></svg>
